  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0b0a">
  <link rel="canonical" href="{{site.origin}}{{page.canonical}}">
{{#if page.alternates}}
  <link rel="alternate" hreflang="tr" href="{{site.origin}}{{page.url_tr}}">
  <link rel="alternate" hreflang="en" href="{{site.origin}}{{page.url_en}}">
  <link rel="alternate" hreflang="x-default" href="{{site.origin}}{{page.url_tr}}">
{{/if}}
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Bağlantı paylaşıldığında görünen önizleme (LinkedIn, WhatsApp, X…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{t.site.name}}">
  <meta property="og:title" content="{{meta.title}}">
  <meta property="og:description" content="{{meta.description}}">
  <meta property="og:url" content="{{site.origin}}{{page.canonical}}">
  <meta property="og:image" content="{{site.origin}}/assets/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{t.site.og_alt}}">
  <meta property="og:locale" content="{{t.lang.og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v={{v}}">
  <script type="application/json" id="ui-strings">{{{ui_json}}}</script>
