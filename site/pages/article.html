<!DOCTYPE html>
<html lang="{{lang}}">
<head>

  <title>{{t.articles.title}} · {{t.site.name}}</title>
  <meta name="description" content="{{t.articles.description}}">
  <link rel="stylesheet" href="/assets/css/articles.css?v={{v}}">
  <!-- Markdown çizici (MIT lisanslı, assets/vendor/markdown-it/LICENSE) -->
  <script src="/assets/vendor/markdown-it/markdown-it.min.js" defer></script>

</head>
<body>

  </main>

{{> footer}}

</html>
